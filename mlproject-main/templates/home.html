<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Valuation Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h1 class="text-center mb-4">Car Valuation Predictor</h1>
            
            <form action="{{ url_for('predict_datapoint')}}" method="post">
                <legend class="h4 mb-3 text-secondary">Enter Car Specifications</legend>
                
                <div class="mb-3">
                    <label class="form-label">Manufacturing Year</label>
                    <input class="form-control" type="number" name="Year" placeholder="e.g., 2018" min="1990" max="2026" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Present Showroom Price (in Lakhs)</label>
                    <input class="form-control" type="number" step="0.01" name="Present_Price" placeholder="e.g., 9.54" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Kilometers Driven</label>
                    <input class="form-control" type="number" name="Kms_Driven" placeholder="e.g., 27000" min="0" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Fuel Type</label>
                    <select class="form-select" name="Fuel_Type" required>
                        <option selected disabled value="">Select Fuel Type</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Seller Type</label>
                    <select class="form-select" name="Seller_Type" required>
                        <option selected disabled value="">Select Seller Type</option>
                        <option value="Dealer">Dealer</option>
                        <option value="Individual">Individual</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Transmission Type</label>
                    <select class="form-select" name="Transmission" required>
                        <option selected disabled value="">Select Transmission</option>
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Number of Previous Owners</label>
                    <select class="form-select" name="Owner" required>
                        <option selected disabled value="">Select Owner History</option>
                        <option value="0">0 (First Owner)</option>
                        <option value="1">1 (Second Owner)</option>
                        <option value="3">3 (Third or More)</option>
                    </select>
                </div>

                <div class="d-grid mt-4">
                    <input class="btn btn-primary" type="submit" value="Predict Selling Price" />
                </div>
            </form>

            {% if results %}
            <div class="mt-4 alert alert-success text-center">
                <h3 class="mb-0">Estimated Selling Price: ₹ {{ results }} Lakhs</h3>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
